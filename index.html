<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cards Score Counter</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Score Counter">
<style>
  :root {
    --bg: #f5f5f4;
    --surface: #ffffff;
    --text: #1c1917;
    --muted: #78716c;
    --border: #d6d3d1;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917;
      --surface: #292524;
      --text: #f5f5f4;
      --muted: #a8a29e;
      --border: #44403c;
      --accent: #60a5fa;
      --accent-soft: #1e3a5f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 480px; margin: 0 auto; padding: 32px 16px 40px; }
  .logo { display: block; width: 200px; max-width: 60%; height: auto; margin: 0 auto 20px; border-radius: 14px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; text-align: center; }
  .sub { color: var(--muted); text-align: center; margin: 0 0 28px; }

  .modes { display: flex; flex-direction: column; gap: 14px; }
  .mode {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .mode:hover, .mode:focus-visible { border-color: var(--accent); background: var(--accent-soft); outline: none; }
  .mode:active { transform: scale(.98); }
  .mode-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .mode h2 { font-size: 1.2rem; margin: 0; }
  .arrow { color: var(--accent); font-size: 1.3rem; }
  .mode p { color: var(--muted); margin: 8px 0 0; line-height: 1.4; font-size: .95rem; }
  .progress {
    display: inline-block;
    margin-top: 10px;
    font-size: .8rem;
    font-weight: 600;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<main>
  <img class="logo" src="ahmed_bradai_logo.svg" alt="Ahmed Bradai logo" width="200" height="125">
  <h1>Score Counter</h1>
  <p class="sub">How do you want to count?</p>

  <div class="modes">
    <a class="mode" href="version_auto.html">
      <div class="mode-head"><h2>Auto</h2><span class="arrow">→</span></div>
      <p>Pick who scored and their points. The other player gets the rest of 160 (+10 C, +20 Belote). Includes Capot, Contrée and x2.</p>
      <span class="progress" data-key="cardsCalculator.v2"></span>
    </a>
    <a class="mode" href="version_manual.html">
      <div class="mode-head"><h2>Manual</h2><span class="arrow">→</span></div>
      <p>Tap points directly onto each player. Nothing is calculated for you.</p>
      <span class="progress" data-key="cardsCalculator.v3"></span>
    </a>
  </div>
</main>

<script>
// Show the game in progress for each mode, if one is saved.
document.querySelectorAll('.progress').forEach(el => {
  try {
    const saved = JSON.parse(localStorage.getItem(el.dataset.key));
    if (!saved || !Array.isArray(saved.rounds) || !saved.rounds.length) return;
    const t = saved.rounds.reduce((t, r) => [t[0] + r.points[0], t[1] + r.points[1]], [0, 0]);
    el.textContent = `Game in progress: ${saved.names[0]} ${t[0]} – ${t[1]} ${saved.names[1]} (${saved.rounds.length} rounds)`;
  } catch (e) {}
});
</script>
</body>
</html>
